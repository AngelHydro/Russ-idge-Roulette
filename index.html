<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ec">
  <title>Russ'idge Roulette</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="ecran-tirage" hidden>
    <header>
      <div>
        <p class="surtitre">Cette semaine</p>
        <h1>Russ'idge Roulette</h1>
      </div>
      <button class="icone" data-ecran="parametres" aria-label="Paramètres">⚙</button>
    </header>
    <ul id="categories" class="carte lignes"></ul>
    <div class="carte budget">
      <label for="budget-valeur" class="surtitre">Budget</label>
      <div class="montant"><input id="budget-valeur" type="number" inputmode="decimal" min="0" step="0.01"><span>€</span></div>
      <input id="budget-curseur" type="range" min="0" max="200" step="5" aria-label="Budget">
      <p id="minimum" class="discret"></p>
    </div>
    <button id="lancer" class="principal">Lancer la roulette</button>
  </section>

  <section id="ecran-liste" hidden>
    <header>
      <div>
        <p class="surtitre">Russ'idge Roulette</p>
        <h1>Ma liste</h1>
      </div>
      <span>
        <button id="partager" class="icone" aria-label="Partager">⤴</button>
        <button class="icone" data-ecran="parametres" aria-label="Paramètres">⚙</button>
      </span>
    </header>
    <div id="liste"></div>
    <footer>
      <p id="message" class="discret" hidden></p>
      <div id="actions" hidden>
        <button data-action="relancer">Relancer</button>
        <button data-action="reste">Relancer le reste</button>
        <button data-action="masquer">Masquer</button>
      </div>
      <div class="carte totaux">
        <div><p class="surtitre">Total</p><span id="total"></span></div>
        <div class="droite"><p class="surtitre">Reste à acheter</p><span id="reste"></span></div>
      </div>
      <button id="nouveau">Nouveau tirage</button>
    </footer>
  </section>

  <section id="ecran-parametres" hidden>
    <header>
      <div>
        <button id="retour" class="icone retour" aria-label="Retour">←</button>
        <h1>Paramètres</h1>
      </div>
    </header>
    <div class="carte">
      <p class="surtitre">Thème</p>
      <div class="segment">
        <label><input type="radio" name="theme" value="auto"> Auto</label>
        <label><input type="radio" name="theme" value="clair"> Clair</label>
        <label><input type="radio" name="theme" value="sombre"> Sombre</label>
      </div>
    </div>
    <div class="carte">
      <p class="surtitre">Affichage des prix</p>
      <div class="segment">
        <label><input type="radio" name="prix" value="paquet"> Au paquet</label>
        <label><input type="radio" name="prix" value="kilo"> Au kilo</label>
      </div>
    </div>
    <div class="carte">
      <label class="ligne"><span>Son du clic</span><input type="checkbox" id="son" role="switch"></label>
    </div>
    <div class="carte">
      <p class="surtitre">Ingrédients masqués</p>
      <ul id="masques" class="lignes"></ul>
    </div>
  </section>

  <div id="roulette" hidden>
    <svg class="barillet" viewBox="-50 -50 100 100" aria-hidden="true">
      <circle r="46" class="corps"/>
      <circle cy="-27" r="11"/><circle cx="23.4" cy="-13.5" r="11"/><circle cx="23.4" cy="13.5" r="11"/>
      <circle cy="27" r="11"/><circle cx="-23.4" cy="13.5" r="11"/><circle cx="-23.4" cy="-13.5" r="11"/>
      <circle r="6"/>
    </svg>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
